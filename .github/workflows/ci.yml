# CI – lint, test och build för snabb feedback på varv
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  mobile-test:
    name: jomoa-mobile (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: jomoa-mobile/package-lock.json

      - name: Install (jomoa-mobile)
        run: npm ci
        working-directory: jomoa-mobile

      - name: Test (jomoa-mobile)
        run: npm run test
        working-directory: jomoa-mobile
